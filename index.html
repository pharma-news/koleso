<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Колесо слов — крути, найди слово и расскажи, что оно значит</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=21">
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="amb amb-lamp"></div>
  <div class="amb amb-drift"></div>
  <div class="amb amb-motes" id="amb-motes"></div>
  <div class="amb amb-grain"></div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="logo">🎡</span>
    <span class="brand-text"><b>Колесо слов</b><small>крути · найди слово в книгах · объясни</small></span>
  </div>
  <div class="top-actions">
    <button class="chip" id="btn-reset" title="Начать заново: зачёркнутые слова вернутся на колесо">↺ Сначала</button>
    <button class="chip btn-theme" id="btn-theme" title="Светлая или ночная тема">🌙 Ночная</button>
  </div>
</header>

<main>
  <section class="wheel-zone">
    <div class="stage">
      <div class="wheel-frame" id="wheel-frame">
        <svg id="wheel" viewBox="0 0 400 448" role="img" aria-label="Колесо слов: двенадцать секторов со словами, сверху стрелка-защёлка"></svg>
        <button class="wheel-tap" id="wheel-tap" aria-label="Крутить колесо"></button>
      </div>
    </div>

    <div class="spin-row">
      <button class="btn primary big" id="spin">🎡 Крутить колесо</button>
    </div>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="word-card" id="word-card">
      <div class="word-kicker">Выпало слово</div>
      <div class="word" id="word">—</div>
      <p class="task" id="task">Найдите это слово в словаре или энциклопедии и скажите, что оно обозначает.</p>
      <div class="word-btns">
        <button class="btn primary" id="found">✓ Нашли и объяснили</button>
      </div>
    </div>
  </section>

  <section class="found-list" id="found-list-wrap">
    <h2>📚 Мы нашли и объяснили</h2>
    <div class="chips" id="found-list"></div>
    <div class="panel-btns"><button class="btn ghost small" id="clear-found">Очистить список</button></div>
  </section>
</main>

<script src="app.js?v=21"></script>
</body>
</html>
