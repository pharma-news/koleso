<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Тарелка слов — крути, найди слово и расскажи, что оно значит</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=34">
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="amb amb-wall"></div>
  <div class="amb amb-paper"></div>
  <div class="amb amb-drift"></div>
  <div class="amb amb-lamp"></div>
  <div class="amb amb-rays"></div>
  <canvas class="amb amb-fx" id="amb-fx"></canvas>
  <div class="amb amb-floor"></div>
  <div class="amb amb-vignette"></div>
  <div class="amb amb-grain"></div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="logo">🍽️</span>
    <span class="brand-text"><b>Тарелка слов</b><small>крути · найди слово в книгах · объясни</small></span>
  </div>
  <div class="top-actions">
    <button class="chip" id="btn-sound" aria-pressed="true" title="Звук включён: храповик, шелест вращения, звон фарфора. М — выключить">🔊 Звук</button>
    <button class="chip" id="btn-reset" title="Начать заново: зачёркнутые слова вернутся на тарелку">↺ Сначала</button>
    <button class="chip btn-theme" id="btn-theme" title="Светлая или ночная тема">🌙 Ночная</button>
  </div>
</header>

<main>
  <section class="dish-zone">
    <div class="stage">
      <div class="dish-frame" id="dish-frame">
        <svg id="dish" viewBox="0 -56 400 504" role="img" aria-label="Тарелка слов: двенадцать секторов со словами, сверху стрелка-указатель"></svg>
        <button class="dish-tap" id="dish-tap" aria-label="Крутить тарелку"></button>
      </div>
    </div>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="spin-row">
      <button class="btn big crank" id="spin">🍽️ Крутить тарелку</button>
    </div>

    <div class="word-card" id="word-card">
      <div class="word-kicker">Выпало слово</div>
      <div class="word" id="word">—</div>
      <p class="task" id="task">Найдите это слово в словаре или энциклопедии и скажите, что оно обозначает.</p>
      <div class="word-btns">
        <button class="btn primary" id="found">✓ Нашли и объяснили</button>
      </div>
    </div>
  </section>
</main>

<script src="sound.js?v=16"></script>
<script src="ambient.js?v=3"></script>
<script src="app.js?v=36"></script>
</body>
</html>
